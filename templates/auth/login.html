{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Welcome back</h2>
  <p>Login to continue your study journey.</p>
  <form>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button class="btn" type="submit">Login</button>
  </form>
</div>
{% endblock %}
